name: tests

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  selftest:
    name: self-test (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check every tool
        run: python -m compileall -q tools

      - name: Run every tool's built-in self-test
        run: sh tests/run_all.sh

      - name: Tools import only the standard library
        run: |
          python - <<'PY'
          import ast, pathlib, sys

          ALLOW = {
              "argparse", "ast", "collections", "csv", "dataclasses", "datetime",
              "difflib", "errno", "fnmatch", "glob", "hashlib", "io", "itertools",
              "json", "math", "os", "pathlib", "random", "re", "shutil", "stat",
              "string", "subprocess", "sys", "tempfile", "textwrap", "time", "typing",
              "unicodedata",
          }

          bad = {}
          for path in sorted(pathlib.Path("tools").glob("*.py")):
              tree = ast.parse(path.read_text(encoding="utf-8"))
              for node in ast.walk(tree):
                  if isinstance(node, ast.Import):
                      mods = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom) and node.level == 0 and node.module:
                      mods = [node.module.split(".")[0]]
                  else:
                      continue
                  for mod in mods:
                      if mod not in ALLOW:
                          bad.setdefault(path.name, set()).add(mod)

          if bad:
              print("non-stdlib imports found:", bad)
              sys.exit(1)
          print("ok: standard library only")
          PY
